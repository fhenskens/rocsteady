# Native prek hooks require no downloaded hook environments.
minimum_prek_version: '0.5.3'
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: '^(src/|tests/|examples/|Cargo\.(toml|lock)$)'
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (all features and targets)
        entry: cargo clippy --locked --all-features --all-targets -- -D warnings
        language: system
        files: '^(src/|tests/|examples/|Cargo\.(toml|lock)$)'
        pass_filenames: false
      - id: cargo-test
        name: cargo test (all features and targets)
        entry: cargo test --locked --all-features --all-targets
        language: system
        files: '^(src/|tests/|examples/|Cargo\.(toml|lock)$)'
        pass_filenames: false
