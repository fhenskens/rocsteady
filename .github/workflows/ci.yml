name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --doc
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo run --locked --features simulator --example simulator
      - run: cargo run --locked --example managed_extensions
      - run: cargo run --locked --example schema_profiles
      - run: cargo run --locked --example discovery_catalog
      - run: cargo run --locked --features simulator --example authenticated_setup
      - run: cargo package --locked --allow-dirty --all-features
      - name: Compile and run a consumer of the extracted package
        shell: pwsh
        run: ./scripts/check-package-consumer.ps1
